<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YohoCat Studio</title>
  <link rel="stylesheet" href="/src/styles/main.css">
  <link rel="icon" type="image/x-icon" href="/src/assets/favicon.ico">
  <link rel="apple-touch-icon" href="/src/assets/favicon.png">
  <link rel="icon" type="image/png" href="/src/assets/favicon.png">
</head>

<body>
  <div id="ui">
    <!-- Controles existentes -->
    <div class="slider-container">
      <label for="waveSlider">🌊 Olas: <span id="waveValue">0.5</span></label>
      <input type="range" id="waveSlider" min="0" max="1.2" step="0.05" value="0.5">
    </div>
    <div class="slider-container">
      <label for="islandSlider">🏝️ Tamaño islas: <span id="islandValue">1.0</span></label>
      <input type="range" id="islandSlider" min="0.4" max="2.0" step="0.1" value="1.0">
    </div>
    <div class="checkbox-container">
      <input type="checkbox" id="showColliders">
      <label for="showColliders">🔵 Ver colisiones</label>
    </div>

    <!-- NUEVOS CONTROLES PARA CÁMARA -->
    <hr style="width:100%; border-color:#555; margin: 8px 0;">
    <div class="slider-container">
      <label for="zoomSlider">🔍 Zoom: <span id="zoomValue">12</span></label>
      <input type="range" id="zoomSlider" min="6" max="20" step="0.5" value="12">
    </div>
    <div class="slider-container">
      <label for="offsetXSlider">📐 Offset X: <span id="offsetXValue">8</span></label>
      <input type="range" id="offsetXSlider" min="4" max="14" step="0.5" value="8">
    </div>
    <div class="slider-container">
      <label for="offsetZSlider">📐 Offset Z: <span id="offsetZValue">8</span></label>
      <input type="range" id="offsetZSlider" min="4" max="14" step="0.5" value="8">
    </div>
    <div class="slider-container">
      <label for="waveCamXSlider">🌊 Oscilación X: <span id="waveCamXValue">0.2</span></label>
      <input type="range" id="waveCamXSlider" min="0" max="0.8" step="0.05" value="0.2">
    </div>
    <div class="slider-container">
      <label for="waveCamZSlider">🌊 Oscilación Z: <span id="waveCamZValue">0.2</span></label>
      <input type="range" id="waveCamZSlider" min="0" max="0.8" step="0.05" value="0.2">
    </div>
    <div class="slider-container">
      <label for="speedOffsetSlider">🚀 Desplazamiento velocidad: <span id="speedOffsetValue">0.5</span></label>
      <input type="range" id="speedOffsetSlider" min="0" max="1.5" step="0.1" value="0.5">
    </div>
    <div class="slider-container">
      <label for="lerpSpeedSlider">🔄 Suavidad cámara: <span id="lerpSpeedValue">0.05</span></label>
      <input type="range" id="lerpSpeedSlider" min="0.01" max="0.2" step="0.005" value="0.05">
    </div>
    <button id="resetCamBtn"
      style="padding:6px 12px; background:#ff9800; border:none; border-radius:6px; color:white; font-weight:bold; cursor:pointer;">🔄
      Reset Cámara</button>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
